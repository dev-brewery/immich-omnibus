# Photoframe Immich — Docker Compose (Multi-Container)
# For users who prefer standard Immich architecture
# Usage: docker compose up -d

name: photoframe-immich

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v1.120.0}
    container_name: photoframe_immich_server
    restart: unless-stopped
    ports:
      - "2283:2283"
    volumes:
      - ${UPLOAD_LOCATION:-./library}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    environment:
      IMMICH_HOST: "0.0.0.0"
      IMMICH_PORT: "2283"
      # Photoframe optimizations
      DISABLE_MACHINE_LEARNING: ${DISABLE_MACHINE_LEARNING:-false}
      ENABLE_MAP: ${ENABLE_MAP:-false}
    healthcheck:
      test: curl -sf http://localhost:2283/api/server-info/ping || exit 1
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v1.120.0}
    container_name: photoframe_immich_ml
    restart: unless-stopped
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    environment:
      MACHINE_LEARNING_WORKERS: ${MACHINE_LEARNING_WORKERS:-1}
      MACHINE_LEARNING_WORKER_CONCURRENCY: ${MACHINE_LEARNING_WORKER_CONCURRENCY:-2}
    healthcheck:
      test: curl -sf http://localhost:3003/ping || exit 1
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  redis:
    image: docker.io/valkey/valkey:9@sha256:3b55fbaa0cd93cf0d9d961f405e4dfcc70efe325e2d84da207a0a8e6d8fde4f9
    container_name: photoframe_immich_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --save 300 100
    healthcheck:
      test: redis-cli ping || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: photoframe_immich_postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION:-./postgres}:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: pg_isready -d ${DB_DATABASE_NAME} -U ${DB_USERNAME} || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  model-cache:
